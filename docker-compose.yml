services:
  onessh:
    image: ghcr.io/lynricsy/onessh:latest
    ports:
      - "8866:8866"
    environment:
      # 改用 ONESSH_MASTER_KEY_FILE 时把本变量置空（两者互斥，见 README）；未定义时 compose 直接报错
      ONESSH_MASTER_KEY: ${ONESSH_MASTER_KEY?required（改用 ONESSH_MASTER_KEY_FILE 时设为空）}
      ONESSH_ADMIN_PASSWORD: ${ONESSH_ADMIN_PASSWORD:?required}
      ONESSH_LISTEN: :8866
      ONESSH_DATA_DIR: /data
      ONESSH_PUBLIC_URL: ${ONESSH_PUBLIC_URL:-}
    volumes:
      - onessh-data:/data
    restart: unless-stopped
volumes:
  onessh-data:
