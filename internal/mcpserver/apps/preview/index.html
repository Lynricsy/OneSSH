<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OneSSH 卡片预览画廊</title>
<style>
:root{color-scheme:light dark;--g-bg:light-dark(#f2f4f6,#0a0c0f);--g-panel:light-dark(#fff,#14181d);
--g-border:light-dark(#dfe3e8,#242a32);--g-text:light-dark(#17191c,#e6e9ed);--g-muted:light-dark(#5c6470,#8b94a1);
--g-accent:light-dark(#0d9488,#2dd4bf)}
*{box-sizing:border-box}
body{margin:0;display:grid;grid-template-columns:230px minmax(0,1fr);height:100vh;
font:13px/1.55 ui-sans-serif,system-ui,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--g-bg);color:var(--g-text)}
aside{border-right:1px solid var(--g-border);overflow:auto;background:var(--g-panel)}
aside h1{margin:0;padding:14px 14px 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--g-muted)}
.item{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--g-text);
padding:7px 14px;font:inherit;cursor:pointer;border-left:2px solid transparent}
.item:hover{background:light-dark(#f6f7f8,#1a1f26)}
.item.active{border-left-color:var(--g-accent);color:var(--g-accent);font-weight:600}
.item small{display:block;color:var(--g-muted);font-size:10.5px;font-weight:400}
main{display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--g-border);background:var(--g-panel)}
.bar b{font-size:12px;margin-right:4px}
button.tgl{border:1px solid var(--g-border);background:transparent;color:var(--g-muted);border-radius:7px;
padding:5px 10px;font:inherit;font-size:11.5px;cursor:pointer}
button.tgl[aria-pressed="true"]{border-color:var(--g-accent);color:var(--g-accent)}
.stage{flex:1;overflow:auto;padding:24px;display:flex;justify-content:center}
.frame-wrap{width:100%;max-width:760px;transition:max-width .2s ease}
.frame-wrap[data-width="mobile"]{max-width:360px}
.host-card{border:1px solid var(--g-border);border-radius:14px;overflow:hidden;background:var(--g-panel);
box-shadow:0 1px 2px #0000000d,0 8px 30px #0000000a}
iframe{display:block;width:100%;border:0;height:120px;background:transparent}
.log{border-top:1px solid var(--g-border);max-height:150px;overflow:auto;padding:8px 16px;background:var(--g-panel);
font:11px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--g-muted);white-space:pre-wrap}
</style>
</head>
<body>
<aside><h1>OneSSH 卡片</h1><nav id="list"></nav></aside>
<main>
  <div class="bar">
    <b id="current">—</b>
    <button class="tgl" id="theme" aria-pressed="false">深色</button>
    <button class="tgl" id="state" aria-pressed="false">错误态</button>
    <button class="tgl" id="width" aria-pressed="false">窄屏</button>
    <button class="tgl" id="reload">重新加载</button>
    <span style="color:var(--g-muted);font-size:11px" id="hint"></span>
  </div>
  <div class="stage"><div class="frame-wrap" id="wrap"><div class="host-card"><iframe id="frame" sandbox="allow-scripts"></iframe></div></div></div>
  <div class="log" id="log"></div>
</main>
<script>
// 这个画廊扮演 MCP Apps 宿主：拼装与 Go 侧完全一致的卡片 HTML，放进沙箱 iframe，
// 再用 postMessage 上的 JSON-RPC 走一遍真实的握手与推送流程，让 32 张卡片可以离线逐一验收。
const TOOLS = [
  ["hosts_list","hosts","主机列表"],["hosts_manage_list","hosts","主机配置"],["host_create","hosts","新增主机"],
  ["host_update","hosts","更新主机"],["host_test","hosts","连通性测试"],["host_reset_fingerprint","hosts","重置指纹"],
  ["host_delete","hosts","删除主机"],
  ["exec","exec","命令执行"],["session_env","exec","会话环境变量"],["output_read","exec","截断输出"],["exec_many","exec","批量执行"],
  ["job_start","jobs","后台任务"],["job_list","jobs","任务列表"],["job_status","jobs","任务状态"],["job_logs","jobs","任务日志"],["job_kill","jobs","终止任务"],
  ["file_read","files","文件内容"],["file_write","files","文件写入"],["file_edit","files","文件编辑"],["file_list","files","目录列表"],["file_transfer","files","文件传输"],
  ["grep","search","内容搜索"],["find","search","路径查找"],
  ["memory_remember","memory","保存记忆"],["memory_recall","memory","召回记忆"],["memory_list","memory","记忆列表"],
  ["memory_update","memory","更新记忆"],["memory_forget","memory","删除记忆"],["memory_stats","memory","记忆统计"],["memory_sleep","memory","记忆维护"],
  ["host_status","monitor","资源指标"],["image_view","image","远程图片"],
];
// 宿主注入的标准 CSS 变量，用来验证卡片确实跟随宿主设计令牌而不是只认自己的兜底色。
const HOST_VARS = {
  light:{"--color-background-primary":"#ffffff","--color-background-secondary":"#f7f7f8","--color-text-primary":"#0d0d0d",
         "--color-text-secondary":"#5d5d5d","--color-border-primary":"#e5e5e5","--border-radius-md":"12px"},
  dark: {"--color-background-primary":"#212121","--color-background-secondary":"#2f2f2f","--color-text-primary":"#ececec",
         "--color-text-secondary":"#b4b4b4","--color-border-primary":"#3d3d3d","--border-radius-md":"12px"},
};
const el = id => document.getElementById(id);
const state = {tool:null, theme:"light", error:false, fixtures:{}, assets:null, seq:0, resultTimer:null};

function logLine(text){ const box=el("log"); box.textContent += text+"\n"; box.scrollTop = box.scrollHeight; }

async function loadAssets(){
  const [shell, style, runtime] = await Promise.all(
    ["../shell.html","../style.css","../runtime.js"].map(u => fetch(u+"?t="+Date.now()).then(r=>r.text())));
  const views = {};
  for (const group of [...new Set(TOOLS.map(t=>t[1]))]) {
    views[group] = await fetch("../views/"+group+".js?t="+Date.now()).then(r=>r.text());
  }
  return {shell, style, runtime, views};
}

function buildHTML(tool, group, title){
  const a = state.assets;
  return a.shell.replaceAll("{{TOOL}}",tool).replaceAll("{{TITLE}}",title)
    .replace("{{STYLE}}", a.style).replace("{{RUNTIME}}", a.runtime).replace("{{VIEW}}", a.views[group]);
}

// 缓存的是 promise 而不是结果：同一个工具被连点两次时只发一次请求，
// 两次 await 也一定拿到同一个对象，不会出现「后发先至」。
function fixture(tool){
  if (!(tool in state.fixtures)) {
    state.fixtures[tool] = fetch("fixtures/"+tool+".json?t="+Date.now())
      .then(r => r.ok ? r.json() : null).catch(() => null);
  }
  return state.fixtures[tool];
}

function send(msg){ el("frame").contentWindow.postMessage(msg, "*"); }
function notify(method, params){ send({jsonrpc:"2.0", method, params: params||{}}); }
function reply(id, result){ send({jsonrpc:"2.0", id, result}); }

window.addEventListener("message", async event => {
  const frame = el("frame");
  // 每次 show() 都会重写 srcdoc，iframe 会换一个全新的 window。把它连同 state.seq 一起记下来，
  // 任何 await 之后都要拿它对账，否则回执与推送会落进已经换过一张卡的 iframe。
  const win = event.source;
  const seq = state.seq, tool = state.tool;
  if (!frame.contentWindow || win !== frame.contentWindow) return;
  const msg = event.data;
  if (!msg || msg.jsonrpc !== "2.0") return;
  if (msg.method) logLine("← " + msg.method + (msg.params && msg.params.height ? " height="+msg.params.height : ""));

  if (msg.method === "ui/initialize") {
    reply(msg.id, {
      protocolVersion: "2026-01-26",
      hostInfo: {name:"onessh-preview", version:"1.0.0"},
      hostCapabilities: {serverTools:{}, serverResources:{}, openLinks:{}, updateModelContext:{}, message:{}},
      hostContext: {
        theme: state.theme, displayMode: "inline", availableDisplayModes: ["inline","fullscreen"],
        locale: "zh-CN", platform: "web",
        containerDimensions: {maxHeight: 640},
        styles: {variables: HOST_VARS[state.theme]},
        toolInfo: {tool: {name: state.tool}},
      },
    });
    return;
  }
  if (msg.method === "ui/notifications/initialized") {
    const data = await fixture(tool);
    // 连点两次工具时，这次 await 完全可能在新卡片装好之后才 resolve。
    if (seq !== state.seq || frame.contentWindow !== win) return;
    if (!data) { logLine("！缺少 fixtures/"+tool+".json"); return; }
    notify("ui/notifications/tool-input", {arguments: data.input || {}});
    // 这 500ms 是故意留的「工具执行中」窗口，用来验收等待态；但它跨越了用户切卡片的时机，
    // 到点时必须确认台上还是同一张卡，不然推过去的就是上一个工具的结果。
    state.resultTimer = setTimeout(() => {
      state.resultTimer = null;
      if (seq !== state.seq || frame.contentWindow !== win) return;
      const result = state.error
        ? (data.error || {content:[{type:"text",text:"host not authorized: web-01"}], isError:true})
        : data.result;
      notify("ui/notifications/tool-result", result);
    }, 500);
    return;
  }
  if (msg.method === "ui/notifications/size-changed") {
    el("frame").style.height = Math.max(60, msg.params.height) + "px";
    return;
  }
  if (msg.method === "tools/call") {
    const data = await fixture(tool);
    const canned = (data && data.calls && data.calls[msg.params.name]) || (await fixture(msg.params.name));
    if (seq !== state.seq || frame.contentWindow !== win) return;   // 卡片已经换人，这条回执不该发过去
    reply(msg.id, canned ? (canned.result || canned) : {content:[{type:"text",text:"预览画廊没有为该调用准备数据"}], isError:true});
    return;
  }
  if (msg.method === "ui/request-display-mode") {
    reply(msg.id, {mode: msg.params.mode});
    el("wrap").style.maxWidth = msg.params.mode === "fullscreen" ? "100%" : "";
    return;
  }
  if (msg.id !== undefined) reply(msg.id, {});
});

async function show(tool){
  const entry = TOOLS.find(t => t[0] === tool);
  if (!entry) return;
  const seq = ++state.seq;              // 每次切换领一个序号，await 回来发现自己不是最新的就整个作废
  state.tool = tool;
  clearTimeout(state.resultTimer);      // 上一张卡还挂着的结果推送，绝不能落进即将装好的新 iframe
  state.resultTimer = null;
  el("current").textContent = tool + " · " + entry[2];
  for (const node of document.querySelectorAll(".item")) node.classList.toggle("active", node.dataset.tool === tool);
  el("log").textContent = "";
  const frame = el("frame");
  frame.style.height = "120px";
  el("wrap").style.maxWidth = "";       // 新卡片从 inline 起步，容器也得跟着退出上一张卡的全屏
  const data = await fixture(tool);
  if (seq !== state.seq) return;        // 期间又点了别的工具，交给最新那次去写 srcdoc
  frame.srcdoc = buildHTML(tool, entry[1], (data && data.title) || entry[2]);
  el("hint").textContent = data ? "" : "缺少 fixture";
}

function boot(){
  const list = el("list");
  let group = null;
  for (const [tool, g, title] of TOOLS) {
    if (g !== group) { group = g; const head = document.createElement("h1"); head.textContent = g; list.append(head); }
    const button = document.createElement("button");
    button.className = "item"; button.dataset.tool = tool;
    button.append(document.createTextNode(tool));
    const small = document.createElement("small"); small.textContent = title; button.append(small);
    button.addEventListener("click", () => show(tool));
    list.append(button);
  }
  el("theme").addEventListener("click", () => {
    state.theme = state.theme === "light" ? "dark" : "light";
    el("theme").setAttribute("aria-pressed", String(state.theme === "dark"));
    document.documentElement.style.colorScheme = state.theme;
    notify("ui/notifications/host-context-changed", {theme: state.theme, styles:{variables: HOST_VARS[state.theme]}});
  });
  el("state").addEventListener("click", () => {
    state.error = !state.error;
    el("state").setAttribute("aria-pressed", String(state.error));
    show(state.tool);
  });
  el("width").addEventListener("click", () => {
    const wrap = el("wrap");
    const narrow = wrap.dataset.width !== "mobile";
    wrap.dataset.width = narrow ? "mobile" : "";
    el("width").setAttribute("aria-pressed", String(narrow));
  });
  el("reload").addEventListener("click", async () => { state.assets = await loadAssets(); state.fixtures = {}; show(state.tool); });
}

loadAssets().then(assets => { state.assets = assets; boot(); show(TOOLS[0][0]); })
  .catch(err => { document.body.textContent = "加载卡片资产失败：" + err + "（需要用静态服务器打开，而不是 file://）"; });
</script>
</body>
</html>
